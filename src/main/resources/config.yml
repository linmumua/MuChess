# MuChess 主配置
# 玩家可见文案不在这里，全部在 lang/zh_CN.yml。

# 调试日志。仅排查命中失败等异常交互时开启，正常运行保持关闭。
debug: false

craftengine:
  # 启动、插件重载与 CraftEngine 重载时检查 plugins/CraftEngine/resources/muchess/。
  #
  # 判定依据是该目录下 pack.yml 的 version 行：与插件版本一致就完全不动，
  # 目录缺失或版本对不上才重新导出完整资源。插件升级后会自动重写，
  # 服主不需要手动删文件夹，也不必自己跑 /chess pack。
  #
  # 代价是升级会覆盖同名的自定义贴图与模型。想保留自己的美术资源，
  # 升级后重新覆盖一次，或者把这个开关关掉自己管理这个目录。
  auto-generate-pack: true
  # 写完资源包后自动让 CraftEngine 重载。
  # 关掉的话需要服主自己执行 /ce reload all，改动才会生效。
  auto-reload: true
  # 手动或内部非强制生成时，内容没变化就跳过重写；自动检查只按 muchess 文件夹是否存在判断。
  skip-if-unchanged: true

checkmate-totem:
  # 将死演出使用公开的双面棋子模型；棋盘实体另用带红黑与四向朝向的内部物品。
  # 红方被将死时播放红帅，黑方被将死时播放黑将；留空字符串可关闭对应阵营。
  red: "muchess:red_king"
  black: "muchess:black_king"

board:
  # 单个世界允许存在的棋盘数量上限，防止有人刷满一片。
  max-per-world: 64
  # 放置时是否要求 2x2 范围内完全空旷。
  # 关掉之后只检查落点，斜坡和台阶上可能出现棋子悬空。
  require-flat-area: true
  # 棋盘面相对方块顶面的抬升高度，避免棋子和地面 z-fighting。
  surface-offset: 0.02
  # 拆掉棋盘家具时是否退还一个棋盘物品。
  #
  # 一副棋盘只对应一个覆盖完整 2x2 的 CraftEngine 家具。默认关闭 CE 自带掉落，
  # 再由这个开关统一返还一个物品，保证放 1 个最多收回 1 个。
  # 关掉的话拆除后不返还，适合不希望棋盘被反复搬走的服务器。
  refund-on-break: true

piece:
  # 棋子显示实体的基础缩放。
  #
  # 这个值要跟格点间距对得上，不能随便填大。棋盘占 2x2（跨度 2.0），
  # 两侧各留 0.12 边距，可用跨度 1.76；纵向 10 条横线，
  # 相邻横线间距 = 1.76 / 9 ≈ 0.196，这是棋子能占的物理上限。
  # 真实棋盘的棋子直径约占间距 85%~90%，所以取 0.17（约 87%）。
  # 填 0.2 以上相邻棋子就会开始互相压边，0.35 会直接糊成一片。
  base-scale: 0.17
  # 选中后放大到的倍数。
  # 放大后允许略微压到邻格（选中态本来就该显眼），但别超过一格间距。
  selected-scale: 0.21
  # 选中后浮起的高度，单位方块。
  hover-height: 0.12
  # 选中时浮起和放大的插值时长，单位 tick。给 0 就是瞬间切换，没有动画。
  # 只管选中态，不决定走子动画的长度，那个看下面的 move-ticks。
  animation-ticks: 4
  # 走子总时长，单位 tick。4 tick 即 0.2 秒。
  #
  # 2 tick 即 0.1 秒，指"抬起 → 飞过去 → 落下"的整段时长，不是其中一段。
  # 平移与升降在这段时间里同时完成，走的是一条连续弧线，不分抬起/平移/落下三段。
  # 时长这么短的话分段每段只剩一帧，看起来是跳变而不是动作。
  #
  # 这段时间内该棋盘不接受新的点击，避免连点穿帧，所以这个值也是输入锁定时长。
  # 允许范围 2~60，2 就是下限：再短就没有起落两帧了。
  move-ticks: 2
  # 走子弧线最高点的高度，单位方块。
  # 与 hover-height 取同一个 0.12：动画只有 2 tick，抬得再高也来不及看清，
  # 反而会让棋子在两帧之间蹦一下。等高也让选中的棋子走子时不会先沉再抬。
  # 低于 hover-height 会被抬到 hover-height，所以 0.12 正好压在下界上。
  move-lift-height: 0.12

highlight:
  # 空合法落点使用透明背景、40% 不透明度的细白圈 ItemDisplay，不再刷新原版粒子。
  #
  # 明显小于 piece.base-scale（0.17）：白圈只是"这里能走"的指示，做得跟棋子一样大
  # 会把棋盘线和相邻棋子盖住，一次选中撒出七八个圈时尤其明显。
  # 贴图外径占 84%，所以 0.06 对应可见外径约 0.050 格，约为棋子直径的 29%。
  marker-scale: 0.06
  # 白圈相对棋盘交点的额外垂直抬升，只改 Y，不参与格点中心校正。
  # 棋盘面本身已有 surface-offset，默认不再额外悬高，减少斜视角下的视差。
  marker-y-offset: 0.0
  # 被将军时是否给将/帅套一圈短暂红色警示粒子。
  # 这个粒子只用于将军警示，不用于合法落点。
  mark-checked-king: true

board-label:
  # 棋盘上方那行悬浮字，整局都在，按阶段换内容：
  #   等人入座、满座待开局 —— 可点，是"入座 / 开始对局"的世界内入口（label-join、label-start）
  #   对局中           —— 只报手数与该谁走，点了不响应（label-playing）
  #   终局             —— 只报胜负，点了不响应（label-finished-win / -timeout / -draw）
  # 文案全在 lang/zh_CN.yml 的 label-* 里。
  #
  # 关掉之后棋盘上方什么都不显示，入座与开局都只剩 shift+右键棋盘打开的箱子菜单。
  # 菜单里那枚按钮会跟着状态换：没坐满时是"加入对局"，坐满后变成"开始对局"，
  # 所以关掉牌子照样能把一局棋开起来，不会卡在满座开不了局。
  # 对局中与终局那两种牌子只是状态告示，关掉不影响下棋，轮次也仍会照常播报。
  # 默认开着是因为玩家得先知道有这个菜单 —— 牌子看得见，shift+右键没有任何提示。
  enabled: true
  # 悬浮字相对棋盘面的高度，单位方块。
  #
  # 默认 1.2：棋盘是贴地家具，1.2 格约在站着的玩家视线高度，
  # 低头看棋盘、抬头就看见牌子。给 0 会让字直接埋进棋盘模型里，所以下界是 0.1 不是 0 ——
  # 填 0 或负数都会被抬到 0.1，不会真的按 0 生效。
  # 调太高（比如 3）就飘在头顶之上，玩家反而不会把它和脚下这副棋盘联系起来。
  # 允许范围 0.1~5.0。
  y-offset: 1.2
  # 文字缩放。
  #
  # 默认 0.5：原版 TextDisplay 的 1.0 是给告示牌那种远距离大字用的，
  # 摆在一副 2x2 的棋盘上方会宽到盖住整个棋盘。0.5 大约是一行普通聊天字的观感。
  # 允许范围 0.1~3.0，给 0 字会缩到不可见。
  scale: 0.5
  # 可见距离**倍率**，不是格数。
  #
  # 这是原版 Display 实体的 view range 属性，实际可见距离约等于
  # 倍率 × 64 格，并且还要再受客户端的实体渲染距离设置压制 ——
  # 客户端调低了的话，配再大也看不到更远。
  # 默认 0.5 对应约 32 格：走近棋盘才看见牌子，不会让一片棋盘区在很远就糊成一堆浮字。
  # 允许范围 0.1~4.0。
  view-range: 0.5
  # 点击判定框的宽度，单位方块。
  #
  # TextDisplay 自己没有命中箱，右键点不到，所以要在同一位置叠一个 Interaction 实体当判定框。
  # 这个值决定"能点到的范围"，与文字实际渲染宽度是两件事：判定框比字略宽一点更好点，
  # 但大到 3 就会挡住棋盘边上的棋子，玩家想选边角的子结果点开了牌子。
  # 默认 1.0 覆盖 label 文案的横向范围。允许范围 0.1~4.0。
  #
  # 下面两个值只在**等人入座**阶段有效：判定框会拦下穿过它的右键，
  # 开局后就摘掉了，免得挡住下棋。对局中与终局的牌子只有文字，点不到也不拦路。
  hitbox-width: 1.0
  # 点击判定框的高度，单位方块。
  #
  # 默认 0.4：比一行字的高度略高一点，够点又不至于在垂直方向拦住射线。
  # 允许范围 0.1~4.0。调到 0 判定框就点不到了，等于按钮失效，
  # 所以下界由加载器兜住，不会真的按 0 生效。
  hitbox-height: 0.4

game:
  # 无吃子和棋的回合数上限。中国规则是 60 回合，按比赛等级可以酌减。
  # 设成 0 表示不启用限着判和。
  draw-move-limit: 60
  # 单方每步思考时限，单位秒。0 表示不限时。
  turn-timeout-seconds: 0
  # 允许悔棋。开了之后对手同意才能撤销上一步。
  allow-undo: false
  # 允许旁观者点击棋盘。默认关，避免看棋的人误触。
  spectator-can-click: false

sound:
  # 落子音效。留空字符串表示不放。
  move: "minecraft:block.wood.hit"
  # 吃子音效。
  capture: "minecraft:entity.item.break"
  # 将军音效。
  check: "minecraft:block.note_block.pling"
  # 终局音效。
  game-over: "minecraft:entity.player.levelup"
  # 选中棋子音效。
  select: "minecraft:ui.button.click"

capture-explosion:
  # 炮吃子时在被吃棋子的位置放一小团爆炸火光并补一声爆炸响。
  #
  # 只给炮：炮是唯一隔子远距离吃子的兵种，这团火光是它的意象。
  # 其它兵种是贴身吃子，加爆炸只会吵。关掉后吃子只保留 sound.capture。
  enabled: true
  # 爆炸音效。这一声是叠加在 sound.capture 上的，不替换它。留空表示只要火光不要声音。
  sound: "minecraft:entity.generic.explode"
  # 爆炸音量，1.0 是原版满音量。
  #
  # 默认 0.2：棋盘是桌面尺度的物件，原版爆炸音量会直接盖掉落子声。
  # 这个值同时决定可听范围，调大会让远处不下棋的玩家也听见。允许范围 0.0~1.0。
  volume: 0.2
  # 爆炸火光的可见半径，单位方块。
  #
  # 默认 0.085，约为 piece.base-scale（0.17）的一半，也就是让火光正好铺满一枚棋子。
  # 原版 EXPLOSION 粒子的显示尺寸写死在客户端改不了，一团能盖住小半个棋盘，
  # 所以这里改用尺寸可控的 DUST_COLOR_TRANSITION 自己堆出一小圈。允许范围 0.01~1.0。
  radius: 0.085

storage:
  # 已放置棋盘写盘间隔，单位秒。改小更保险，改大更省 I/O。
  save-interval-seconds: 300

bot:
  # 机器人的思考延迟，单位 tick。
  #
  # 机器人用 alpha-beta 搜索，象棋与五子棋各有自己的估值；
  # 用 /chess bot add 加入、/chess bot remove 撤下。
  # 给 0 会在玩家落子的同一 tick 立刻回手，看着很鬼畜；20 tick 是 1 秒。
  #
  # 这是表现上的停顿，与下面 think-time-limit-ms 的搜索耗时上限是两件事。
  think-ticks: 20
  # 搜索层数（半回合）。
  #
  # 2 表示"我走一步、对手回一步"。这是能看出反击的最低层数：
  # 1 层只看到自己这一手的收益，会拿車去吃有保护的兵，也判不出对手下一手能连五。
  #
  # 调到 3 以上棋力略升但耗时明显上涨（象棋每层约 40 个分支，加一层乘 40），
  # 必须靠 think-time-limit-ms 兜住。允许范围 1~6。
  depth: 2
  # 五子棋的候选半径：只考虑已有子周围这么多格内的空点。
  #
  # 15 路盘有 225 个点，全搜两层是 5 万个局面，而离战场十格远的点
  # 在五子棋里毫无意义 —— 五子棋的价值完全是局部的。允许范围 1~4。
  #
  # 只影响落子式棋种（五子棋）；象棋的候选是全部合法着法，与本项无关。
  candidate-radius: 2
  # 每个搜索节点最多展开多少个候选着法。
  #
  # 候选已按好坏排序，截断丢掉的是评分最低的那些。
  # "自己能连五就下、对手能连五就堵"这两手不受本项影响，它们独立于候选生成。
  # 允许范围 4~120，调小提速但会漏掉活三级别的防守。
  max-candidates: 24
  # 每手搜索的耗时上限，单位毫秒。
  #
  # 搜索用逐层加深，超时交出上一层已完整搜完的结果，不会交半层结果
  # （半层里有的分支算过有的没算，选出来的手可能比不搜还差）。
  #
  # 给 0 表示不限时，只有离线跑测试才该这么配。允许范围 0~5000。
  think-time-limit-ms: 200

gomoku:
  # 五子棋棋子（黑白子）的显示缩放。
  #
  # 五子棋 15 路盘铺在同样的 2x2 家具上，格点间距只有 (2.0-0.24)/14 ≈ 0.126 格，
  # 不到象棋的一半，所以不能沿用 piece.base-scale（0.17）—— 那样棋子直径会超过
  # 格点间距的 124%，相邻子直接叠在一起。
  #
  # 默认 0.116：圆盘直径约占格点间距的 85%，与象棋子在自己盘上的观感一致。
  # 允许范围 0.01~0.14，超过 0.14 相邻子会压边。
  base-scale: 0.116
  # 是否启用禁手判负（三三、四四、长连）。
  #
  # 默认关闭：禁手是高水平对局才需要的平衡规则，开着会让新手莫名被判负。
  # 关闭时黑白双方规则完全对称，只判连五即胜。
  forbidden-moves: false

# 围棋
go:
  # 围棋棋子（黑白子）的显示缩放。
  #
  # 围棋 19 路盘铺在 3x3 家具上，格点间距 (3.0-0.24)/18 ≈ 0.153 格，
  # 比五子棋(0.126)略宽但比象棋(0.22)窄，所以要单独给一档。
  #
  # 默认 0.130：圆盘直径约占格点间距的 85%，与另两个棋种的观感一致。
  # 允许范围 0.01~0.16，超过 0.16 相邻子会压边。
  base-scale: 0.130
  # 贴给白方的子数（komi）。
  #
  # 单位是「子」不是「目」—— 本插件用中国数子法结算：
  # 双方得分 = 己方盘上子数 + 只被己方围住的空点，白方再加这个贴子。
  #
  # 默认 3.75 是中国规则的标准贴子，等价于日韩数目法的 7.5 目。
  # 如果按数目法的习惯填 6.5，等于贴子几乎翻倍，白方会凭空多出近一倍补偿。
  #
  # 带 .75 的小数尾数还顺带消除了平局。填整数（含 0）则可能出现平局，
  # 那时播报走 game-over-score-draw。
  # 允许范围 0~20。
  komi: 3.75
  # 围棋机器人每个节点最多展开多少个候选着法。
  #
  # 单独一档而不是共用 bot.max-candidates（24）：围棋 19 路要更狠的裁剪，
  # 但改共用值会连带削弱五子棋的防守能力。
  #
  # 默认 12 有实测依据：19 路中盘生成一次合法着法约 1ms，两层搜索的节点数是
  # 候选数的平方。24 个候选约 576ms，超出 bot.think-time-limit 的 200ms 预算；
  # 12 个候选约 144ms，落在预算内。
  #
  # 不建议低于 8：候选来源有三类（已有子附近、救己方危块、提对方危块），
  # 调太小会把后两类挤掉，机器人就不会救子也不会提子了。
  # 允许范围 4~60，超过 60 在 19 路上必然超时。
  bot-max-candidates: 12
  # 开局背景音乐。
  #
  # 只有围棋有这一档：象棋、五子棋一局几分钟，配长曲子反而吵；围棋一局动辄半小时，
  # 有段安静的背景音才对得上那个节奏。
  #
  # 曲子由插件自己的 CraftEngine 资源包提供，服主不用手工拼包。
  # CraftEngine 缺失时资源包不会下发，客户端收不到这个声音事件，静默无声，不影响对局。
  opening-bgm:
    # 是否启用。
    #
    # 默认关闭：背景音乐很主观，默认响起来会打扰只想安静下棋的人。
    # 这里是总闸，开启后每局还能在对局菜单里各自关掉。
    enabled: false
    # 声音事件 id。
    #
    # 默认是资源包自带的那首。也可以填服主自己包里的曲子，或原版音乐
    # （例如 minecraft:music_disc.cat）。
    # 留空表示不播放，效果和 enabled: false 一样。
    sound: "muchess:music.go_opening"
    # 音量，0.0~1.0。
    #
    # 走音乐声道（MUSIC），玩家能在客户端音量设置里单独调小或静音，不影响落子声。
    # 默认 0.6 而不是 1.0：这是背景音，压过棋子落盘的声音就本末倒置了。
    # 填大于 1 的值没用，MC 那样只会放大可听距离而不是音量，这里会夹回 1.0。
    volume: 0.6
    # 重播周期，秒。
    #
    # MC 客户端不能让一个声音自己循环，只能到点重播，所以这个值必须**略大于**曲子时长：
    # 小了同一段音乐会叠着放，越叠越吵；大了两遍之间有长静音。
    #
    # 自带曲子 65.55 秒，默认 66 正好留 0.45 秒空档，听不出来。
